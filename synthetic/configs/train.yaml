dataset:
  # Generate all 100,000 draws to preserve the experimental RNG sequence.
  # The downstream scripts use only the final 50,000 samples.
  num: 100000
  x_dim: 38
  y_dim: 2
  std: 0.3
  is_nonlinear: true
  scale: true  # Fit z-score normalization separately for each training stage.

vae:
  # Latent model trained on the response Y before DQR/CReL.
  z_dim: 2
  num_ep: 10000
  dropout: 0
  lr: 0.0001
  wd: 0
  batch_size: 512
  wait: 200
  loss_name: "MSE"  # Reconstruction loss for the synthetic VAE.
  kl_mult: 0.001

dqr:
  # Directional quantile regression settings for latent prediction sets.
  tau: 0.1  # Base DQR training uses tau - 0.03; evaluation alpha is a CLI option.
  num_epochs: 1000
  hidden_dimensions: [8, 16, 8]
  batch_size: 32
  patience: 30
  dropout: 0
  learning_rate: 0.001
  weight_decay: 0.0
  num_u: 1024  # Shuffle the first 1,024 directions of the cached 2,048-direction pool.
  num_ens: 1
